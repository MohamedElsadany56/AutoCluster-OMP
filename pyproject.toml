[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocluster-omp"
version = "0.1.0"
description = "A lightweight source-to-source OpenMP auto-parallelizer for K-Means and Fuzzy C-Means C kernels."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas",
    "matplotlib",
    "rich",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
autocluster-omp = "autocluster_omp.cli:main"

[tool.setuptools.packages.find]
include = ["autocluster_omp*"]
